{% extends "base.html" %}

{% block content %}
<div class="clear-db-container">

    <h2>Wyczyść bazę danych</h2>

    <form method="POST" action="{{ url_for('admin.clear_db') }}">

        <input type="hidden" name="csrf_token" value = "{{ csrf_token() }}" />  
        
        <p>Czy na pewno chcesz wyczyścić bazę danych? Ta operacja usunie WSZYSTKIE dane i nie może być cofnięta.</p>

        <button type="submit">Wyczyść bazę danych</button>
    </form>
    
</div>
{% endblock %}
